name: alert-loop

on:
  schedule:
    # Safety net only, in case the self-dispatch chain below ever breaks (a
    # crash, a timeout, a platform outage). GitHub's own */5 schedule proved
    # to fire only ~once/hour in practice on this repo, nowhere near 5-minute
    # cadence, which is why the chain does the real work.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A slow run must never pile up on top of the next scheduled one.
concurrency:
  group: alert-loop
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark start
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      # The schedule trigger is a *revival* mechanism, not a second engine.
      # Firing it while the self-dispatch chain is already alive forks the
      # chain: two independent chains then run out of phase, doubling API load
      # and double-incrementing the missing_runs counter that drives sale
      # inference (an item reaches "sold" in half the intended time). Observed
      # live on this repo — two comps chains ran 8 minutes apart until the
      # concurrency group cancelled one, and a cancelled run does NOT execute
      # `if: always()` steps, so that fork died silently instead of chaining.
      #
      # So: on a scheduled trigger, stand down unless the chain has actually
      # stopped. GUARD_MINUTES is comfortably longer than one cycle (~5 min)
      # and shorter than the schedule interval (15 min).
      - name: Stand down if the chain is alive
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GUARD_MINUTES: "12"
        run: |
          LAST=$(gh run list --workflow alert.yml --repo "${{ github.repository }}" \
                   --event workflow_dispatch --limit 1 \
                   --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$LAST" ]; then
            echo "no dispatch run on record — reviving the chain"
            exit 0
          fi
          AGE=$(( ( $(date +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
          echo "last dispatched run was ${AGE}m ago (threshold ${GUARD_MINUTES}m)"
          if [ "$AGE" -lt "$GUARD_MINUTES" ]; then
            echo "chain is alive — standing down"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "chain looks dead — reviving"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Run alert loop
        if: steps.guard.outputs.skip != 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python alert_loop.py

      # Self-dispatch is what actually keeps the ~5-minute cadence: the repo's
      # auto-generated GITHUB_TOKEN can't trigger workflow_dispatch (GitHub
      # blocks that to prevent recursive-run loops), so this uses a personal
      # token instead, stored as a secret. `if: always()` ensures the chain
      # survives even if the run above fails or crashes.
      - name: Chain next run
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          ELAPSED=$(( $(date +%s) - START ))
          REMAINING=$(( 300 - ELAPSED ))
          if [ "$REMAINING" -gt 0 ]; then sleep "$REMAINING"; fi
          gh workflow run alert.yml --repo "${{ github.repository }}"
